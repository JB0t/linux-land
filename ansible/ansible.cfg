[defaults]
inventory = inventory.ini
roles_path = roles
retry_files_enabled = false
callback_result_format = yaml
interpreter_python = /usr/bin/python3

[ssh_connection]
# Ansible's defaults plus keepalives: a connection to another machine that
# drops without closing fails in about 45s instead of hanging the run.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=3

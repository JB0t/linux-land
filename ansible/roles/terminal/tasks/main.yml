---
# The terminal emulator set up like the GNOME Terminal profile on Linux:
# Ghostty on macOS, Windows Terminal's profile for the distro on WSL.
- name: Set up Ghostty
  when: is_macos
  ansible.builtin.include_tasks: macos.yml

- name: Set up Windows Terminal
  when: is_wsl
  ansible.builtin.include_tasks: wsl.yml

---
# Versions. "latest" resolves the newest release on each run and only
# downloads when it differs from what is installed. Pin a value (e.g.
# v0.12.5, go1.27.1, v4.54.1) to make a machine reproducible.
nvim_version: latest
go_version: latest
yq_version: latest
fzf_version: latest
nvm_version: v0.40.3
node_version: lts            # "lts" or an exact version such as v24.13.0

# Per-machine values, used only to seed files that don't exist yet
# (~/.bash_extras, ~/.bash_search_dirs, tx init sessions). Override with
# -e, e.g. ./setup.sh -e notes_dir=~/work/notes
git_root_dir: "{{ home }}/git"
notes_dir: "{{ home }}/notes"
search_dirs:
  - "{{ home }}/git"
  - "{{ home }}/workspace"

# How the target gets linux-land's files:
#   link: link $HOME into this checkout (setting up the machine you run on)
#   copy: copy the checkout's tracked files to linux_land_copy_dir on the
#         target and link $HOME into that copy, so a remote machine needs no
#         checkout or GitHub access. Re-run setup here to update it.
# Defaults to link for a local connection, copy for any other.
linux_land_mode: "{{ 'link' if ansible_connection | default('ssh') == 'local' else 'copy' }}"
linux_land_copy_dir: "{{ home }}/.local/share/linux-land"

apt_packages:
  - git
  - curl
  - ca-certificates
  - unzip
  - build-essential
  - tmux
  - xclip
  - ripgrep
  - fd-find
  - jq
  - ncdu
  - python3-venv

# macOS: Homebrew formulae instead. The GNU tools go ahead of the BSD ones on
# PATH (.bashrc), so bash_additions and tx behave as they do on Linux; bash
# 5 because /bin/bash is 3.2. pbcopy/pbpaste stand in for xclip, and the
# Xcode Command Line Tools (Homebrew needs them) for build-essential.
brew_packages:
  - git
  - bash
  - bash-completion@2
  - coreutils
  - findutils
  - gnu-sed
  - gnu-tar
  - grep
  - tmux
  - ripgrep
  - fd
  - jq
  - ncdu

# macOS: make Homebrew's bash the login shell, so Terminal (and tmux) start
# the same bash config as Linux. false leaves the login shell alone.
macos_bash_login_shell: true

# macOS: Ghostty's config, written by the terminal role to
# ~/.config/ghostty/config, matching the GNOME Terminal profile on the Linux
# machines. Each key is a Ghostty option (ghostty +show-config --docs).
ghostty_config:
  font-family: JetBrainsMono Nerd Font
  font-size: 12
  background: "#000000"
  foreground: "#ffffff"
  bold-color: "#c792ea"
  background-opacity: 0.85         # GNOME's is 0.72 (28% transparency)
  cursor-style-blink: false
  macos-option-as-alt: true        # tmux's Alt bindings and Alt+V
ghostty_command: tmux              # exec'd by a login bash
terminal_casks:
  - ghostty
  - font-jetbrains-mono-nerd-font

# WSL: Windows Terminal's profile for this distro, set by the terminal role
# to match the GNOME Terminal profile on the Linux machines. Windows
# Terminal has no setting for a bold colour or (per profile) cursor blink.
windows_terminal_profile: ""       # a profile name or guid; "" = the one for this distro
windows_terminal_nerd_font: JetBrainsMono   # a ryanoasis/nerd-fonts release zip, installed for the Windows user
windows_terminal_profile_settings:  # keys of a profile in settings.json
  font:
    face: JetBrainsMono Nerd Font
    size: 12
  background: "#000000"
  foreground: "#FFFFFF"
  opacity: 72                      # GNOME's 28% transparency
  useAcrylic: false
  bellStyle: none
  intenseTextStyle: bold
windows_terminal_command: tmux     # run by a login bash in the distro
windows_terminal_settings_path: Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json  # under LOCALAPPDATA
windows_powershell: /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe

# Files and dirs in this repo (or its copy), symlinked into $HOME
dotfile_links:
  - { src: .bashrc, dest: .bashrc }
  - { src: .bash_additions, dest: .bash_additions }
  - { src: bash_additions, dest: bash_additions }
  - { src: .tmux.conf, dest: .tmux.conf }
  - { src: .tmux/tx/opts, dest: .tmux/tx/opts }
  - { src: .tmux/tx/opts_dir, dest: .tmux/tx/opts_dir }
  - { src: nvim, dest: .config/nvim }

# Links for one OS only, on top of dotfile_links
dotfile_links_by_system:
  Linux:
    - { src: bin/machine, dest: .local/bin/machine }  # apt and Ubuntu only
  Darwin:
    # macOS terminals start login shells, which read ~/.bash_profile, not ~/.bashrc
    - { src: .bash_profile, dest: .bash_profile }

# tx sessions created by `tx init`. Seeded once; sessions are per machine.
tx_init_sessions:
  notes: "{{ notes_dir }}"
  linux-land: "{{ linux_land_dir }}"
  git: "{{ git_root_dir }}"
  playground: "{{ home }}"

# Mason package -> binary it puts in mason/bin
mason_packages:
  lua-language-server: lua-language-server
  gopls: gopls
  bash-language-server: bash-language-server
  pyright: pyright
  delve: dlv

treesitter_parsers:
  - vimdoc
  - lua
  - bash
  - go
  - python
  - javascript
  - typescript
  - json
  - yaml
  - c
  - markdown
  - markdown_inline

# Release asset naming per OS and CPU architecture (ansible_facts['system']
# and ['architecture']: Apple silicon reports arm64, Linux on ARM aarch64)
arch_names:
  Linux:
    x86_64: { nvim: linux-x86_64, go: linux-amd64, yq: linux_amd64 }
    aarch64: { nvim: linux-arm64, go: linux-arm64, yq: linux_arm64 }
  Darwin:
    x86_64: { nvim: macos-x86_64, go: darwin-amd64, yq: darwin_amd64 }
    arm64: { nvim: macos-arm64, go: darwin-arm64, yq: darwin_arm64 }

# macOS: Homebrew's prefix per CPU architecture
brew_prefixes:
  x86_64: /usr/local
  arm64: /opt/homebrew
